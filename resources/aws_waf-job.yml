resources:
  jobs:
    aws-waf-connector:
      name: aws-waf-connector
      parameters:
        - name: source_name
          default: "aws_waf"
        - name: target_catalog
          default: "${var.catalog}"
        - name: ingestion_mode
          default: "log_stream"    # log_stream (preferred) | sdk_sampled (fallback)
        - name: hwm_reset
          default: "false"
      schedule:
        # Every 15 minutes: log-stream autoloader catches Firehose-delivered
        # batches with low latency. SDK-fallback deployments can override
        # via the ingestion_mode parameter without changing the schedule.
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/connectors/aws_waf/ingest.py
          job_cluster_key: shared
          max_retries: 3
          min_retry_interval_millis: 2000
          retry_on_timeout: true
        - task_key: transform
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/connectors/aws_waf/transform.py
          job_cluster_key: shared
          max_retries: 3
          min_retry_interval_millis: 2000
          retry_on_timeout: true
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
