bundle:
  name: appsec

include:
  - src/platform/resources/*.yml
  - src/connectors/*/resources/*.yml
  - src/analytics/resources/*.yml

variables:
  catalog:
    description: Unity Catalog name, per environment
    default: appsec_dev
  warehouse_id:
    description: Unity Catalog SQL warehouse ID for the platform-bootstrap job
  artifact_bucket:
    description: S3 bucket for scanner artifacts (operator-supplied)
  servicenow_host:
    description: ServiceNow instance host (no protocol)
  servicenow_username:
    description: ServiceNow service account username
  servicenow_password:
    description: ServiceNow service account password

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${env.DATABRICKS_HOST}
    variables:
      catalog: appsec_dev
  staging:
    mode: production
    workspace:
      host: ${env.DATABRICKS_HOST}
      root_path: /Shared/appsec-staging
    variables:
      catalog: appsec_staging
  prod:
    mode: production
    workspace:
      host: ${env.DATABRICKS_HOST}
      root_path: /Shared/appsec
    variables:
      catalog: appsec_prod
