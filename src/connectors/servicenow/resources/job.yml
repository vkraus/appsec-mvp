resources:
  jobs:
    servicenow-connector:
      name: servicenow-connector
      parameters:
        - name: source_name
          default: "servicenow"
        - name: target_catalog
          default: "${var.catalog}"
        - name: hwm_reset
          default: "false"
      schedule:
        # Daily cadence: ServiceNow CMDB drift is slow (applications and
        # team ownership change on the order of days, not minutes). The
        # daily transform run lifts freshly-ingested Lakeflow Connect bronze
        # rows into the canonical Silver entity tables.
        #
        # Live ingestion is owned by the Lakeflow Connect pipeline declared
        # in ../resources/pipeline.yml — this job runs the downstream
        # Bronze→Silver transform only.
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: transform
          notebook_task:
            notebook_path: ../transform.py
          job_cluster_key: shared
          max_retries: 3
          min_retry_interval_millis: 2000
          retry_on_timeout: true
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
