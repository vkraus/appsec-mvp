# ServiceNow CMDB → Silver entity-only mapping.
#
# CMDB sources emit entities, not findings. No category/severity/status
# discriminator applies. One block per target Silver table per
# generate-connector CMDB reference.
#
# Bronze envelope: `_raw_payload` is a JSON column containing the raw
# ServiceNow record. Field paths below resolve inside that payload.

applications:
  target_table: silver.applications
  source_endpoint: /api/now/table/cmdb_ci_business_app
  fields:
    application_id: sys_id
    name: name
    owner_email: owned_by.email
    criticality_raw: u_criticality
    updated_at_raw: sys_updated_on

teams:
  target_table: silver.teams
  source_endpoint: /api/now/table/sys_user_group
  fields:
    team_id: sys_id
    team_name: name
    manager: manager
    email: email
    parent: parent
    updated_at_raw: sys_updated_on

app_repo_mapping:
  target_table: silver.app_repo_mapping
  source_endpoint: /api/now/table/cmdb_rel_ci
  fields:
    application_id: parent
    repository_id: child
    rel_type: type
    linked_at_raw: sys_updated_on
