# GitHub severity lookup.
#
# Covers the two GHAS vocabularies documented on the connector page:
#   - `rule.security_severity_level` + `security_advisory.severity` (4-level)
#   - `rule.severity` (CodeQL interpretive 4-level; used as fallback when
#     `security_severity_level` is absent on non-security rules)
# The transform applies `security_severity_level` first and falls back to
# `rule.severity` per the page quirk "Dual severity fields on code-scanning
# alerts". Unknown source values should fall through to the configured
# default `medium` and emit a data-quality warning (DQ path).
#
# Used only once GHAS finding ingestion is enabled; the MVP is entity-only.

# Security-severity vocabulary (code-scanning security rules, dependabot)
critical: critical
high: high
medium: medium
low: low

# CodeQL interpretive vocabulary (rule.severity fallback)
error: high
warning: medium
note: low
none: low
