# GitHub connector: declarative Bronze-to-Silver column expressions.
#
# Per the SCM connector-generation reference, an SCM source's mapping.yml has
# two top-level blocks (`entities` and `findings`) when the source emits both
# roles. The MVP ingests the SCM entity subset only (repositories, commits,
# pull requests, branch policies); GHAS finding ingestion (code-scanning,
# secret-scanning, dependabot) is documented in the connector page's
# Reference section as intended scope but is not implemented, so the
# `findings` block is intentionally omitted per the "pure-entity sources
# omit the findings block" rule in references/scm.md.
#
# Severity and status lookup files exist for uniformity across connectors
# and to pin the vocabulary the GHAS follow-up will use:
#   severity: config/severity/github.yml
#   status:   config/status/github.yml

entities:
  # GitHub /orgs/{org}/repos -> silver.repositories
  repository:
    target_table: silver.repositories
    source_endpoint: GET /orgs/{org}/repos
    fields:
      repository_id: full_name
      full_name: full_name
      default_branch: default_branch
      updated_at: updated_at
