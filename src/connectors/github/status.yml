# GitHub status lookup.
#
# Covers the lifecycle states documented on the connector page for the three
# GHAS finding shapes:
#   - code-scanning: open, dismissed, fixed
#   - secret-scanning: open, resolved
#   - dependabot: open, fixed, dismissed, auto_dismissed
# Unknown source values should fall through to the configured default `open`
# and emit a data-quality warning (DQ path).
#
# Used only once GHAS finding ingestion is enabled; the MVP is entity-only.

open: open
dismissed: false_positive
fixed: resolved
resolved: resolved
auto_dismissed: wontfix
