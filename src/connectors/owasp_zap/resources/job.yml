resources:
  jobs:
    owasp_zap-connector:
      name: owasp_zap-connector
      parameters:
        - { name: source_name,    default: "owasp_zap" }
        - { name: target_catalog, default: "${var.catalog}" }
        - { name: hwm_reset,      default: "false" }
      schedule:
        quartz_cron_expression: "0 45 */3 * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: ingest
          notebook_task: { notebook_path: ../ingest_entry.py }
          job_cluster_key: shared
        - task_key: transform
          depends_on: [{ task_key: ingest }]
          notebook_task: { notebook_path: ../transform_entry.py }
          job_cluster_key: shared
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
