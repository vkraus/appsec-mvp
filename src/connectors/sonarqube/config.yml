source: sonarqube
category: sast
# Authentication and base URL — the actual values are resolved from the
# Databricks secret scope (mvp-connectors). The base_url here is the
# placeholder host used in unit tests; the real value comes from
# sonarqube_url via load-secrets.sh.
base_url: https://sonarqube.internal
auth:
  type: bearer
  token_secret: sonarqube_token
bucket_secret_scope: mvp-connectors
base_url_secret: sonarqube_url
auth_secret: sonarqube_token
pagination:
  strategy: offset
  page_size: 500
hwm:
  strategy: updated_at
  column: updateDate
hwm_column: updateDate
# Bronze / Silver targets
bronze_table: ${catalog}.bronze_sonarqube.issues
# Declarative lookups
severity_map: src/connectors/sonarqube/severity.yml
status_map:   src/connectors/sonarqube/status.yml
