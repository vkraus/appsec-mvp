source: sonarqube
category: sast
# severity_map / status_map point at the YAML lookup tables on disk.
# No code currently loads this connector's config.yml; the pointers
# follow the convention so that when the loader lands, the paths are
# already stable.
severity_map: src/connectors/sonarqube/severity.yml
status_map:   src/connectors/sonarqube/status.yml
bucket_secret_scope: mvp-connectors
bronze_table: ${catalog}.bronze_sonarqube.findings_raw
base_url_secret: sonarqube_url
auth_secret: sonarqube_token
hwm_column: updated_at
