# Semgrep status lookup.
#
# CLI mode is stateless: each scan is a complete snapshot with no
# server-side lifecycle state. All CLI findings land as `open`; the
# Bronze-to-Silver dedup reconstructs continuity across scans using
# the SAST dedup key (repository_id, file_path, rule_id, start_line).
#
# Cloud Platform mode's `state` field ("open", "removed") is mapped
# below for forward-compatibility; only `open` is exercised in the
# MVP since CLI mode is the implemented path.
open: open
removed: resolved
