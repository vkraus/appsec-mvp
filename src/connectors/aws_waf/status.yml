# AWS WAF status canonical literal.
#
# WAF events have no native lifecycle — each event is a point-in-time
# observation. The canonical status_canonical is the literal `open`
# (matching the trufflehog convention; see
# .claude/skills/generate-connector/references/waf.md).
#
# Transform.py emits status_canonical = STATUS_LITERAL = "open" without
# consulting this file at runtime, but the lookup is present so:
#   1. Every connector ships severity.yml + status.yml (the every-connector-
#      has-both-files contract).
#   2. The `default` row carries the configurable literal an operator can
#      override at deploy time without touching transform.py.
default: open
open:    open
