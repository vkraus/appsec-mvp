# AWS WAF log record -> silver.findings.
#
# Target Silver table is silver.findings (the canonical finding-shape table —
# was previously the dedicated silver.waf_events; collapsed for schema
# uniformity with all other connectors). See references/waf.md.
#
# Severity is DERIVED from the action field via the action-keyed lookup
# (severity.yml). There is no source-supplied severity.
#
# Status is the literal `open` (matches the trufflehog convention for
# sources without a native lifecycle; WAF events do not transition).
#
# WAF telemetry NOT carried by silver.findings (source_ip, country,
# http_method, response_code, sampling_weight, rule_type, action) is
# intentionally dropped from the canonical record. Operators query
# upstream WAF logs (S3 / CloudWatch) for that detail.
source_key: aws_waf
target_table: silver.findings

fields:
  finding_id:
    derive: sha256(webaclId, httpRequest.requestId, timestamp)  # deterministic; collapses re-deliveries
  tool_source:        "aws_waf"
  category:           "waf"
  severity_canonical:
    source_path: action                                # ACTION-KEYED (no source severity)
    lookup: severity.yml
  status_canonical:   "open"                           # literal (no lifecycle)
  cwe_id:             null                             # N/A for WAF events
  cve_id:             null                             # N/A for WAF events
  rule_id_native:     terminatingRuleId
  trigger_context:    "live-traffic"                   # or 'sdk-sampled' depending on ingest path
  repository_id:      null                             # WAF events are not repo-scoped
  file_path:          null
  start_line:         null
  url:                httpRequest.uri                  # request URI is the closest finding "location"
  first_seen_at:      timestamp                        # epoch ms -> UTC datetime at transform
  last_seen_at:       timestamp                        # same — events are point-in-time
