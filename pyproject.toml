[project]
name = "appsec-mvp"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyGithub>=2.3",
    "python-gitlab>=4.4",
    "boto3>=1.34",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyspark==3.5.0",
    "delta-spark==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
