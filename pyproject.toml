[project]
name = "appsec-mvp"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyGithub>=2.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyspark==3.5.0",
    "delta-spark==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["*.tests", "*.tests.*", "*.fixtures", "*.fixtures.*"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-ra -q --strict-markers"
markers = [
    "e2e: end-to-end evidence tests (require Delta Lake local session)",
    "integration: tests that hit recorded API fixtures",
    "requirement: tag linking a test to a REQ-* identifier in the appsec-docs catalog",
]
