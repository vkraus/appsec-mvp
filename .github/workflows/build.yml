name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mkdocs/requirements.txt

      - name: Install docs dependencies
        working-directory: mkdocs
        run: pip install -r requirements.txt

      - name: Build docs site
        working-directory: mkdocs
        run: mkdocs build --strict

      - name: Archive source tree
        run: git archive --format=zip --output=appsec-mvp.zip HEAD

      - name: Archive rendered docs
        run: |
          cd mkdocs/site
          zip -r ../../appsec-mvp-docs.zip .

      - name: Stage zips for Pages
        run: |
          cp appsec-mvp.zip mkdocs/site/appsec-mvp.zip
          cp appsec-mvp-docs.zip mkdocs/site/appsec-mvp-docs.zip

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: mkdocs/site

      - name: Upload source zip
        uses: actions/upload-artifact@v7
        with:
          name: appsec-mvp
          path: appsec-mvp.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload docs zip
        uses: actions/upload-artifact@v7
        with:
          name: appsec-mvp-docs
          path: appsec-mvp-docs.zip
          retention-days: 90
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
