# Semgrep severity lookup.
#
# The reference implementation runs the Semgrep CLI (Docker-hosted mode)
# and ingests the JSON output's `extra.severity` values. The CLI
# vocabulary is three-level: ERROR, WARNING, INFO. Undocumented values
# fall through to the default `medium` with a data-quality warning
# (see src/common/silver.py::normalize_severity).
#
# Semgrep Cloud Platform mode is documented on the connector page as
# intended scope but is not implemented in the MVP; its five-level
# vocabulary (high, medium, low, info, experiment) would be maintained
# in a separate file keyed by deployment_mode.
ERROR: high
WARNING: medium
INFO: low
